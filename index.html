<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NostrComments — moved to nostrcomments.github.io</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://nostrcomments.github.io/">
<!-- Without script this lands on the right page, only without the ?url= part. -->
<meta http-equiv="refresh" content="0; url=https://nostrcomments.github.io/">
<script>
// The site moved in November 2026. Keep the path, the query and the fragment, so an old
// "Read the thread: …/thread/?url=…" link in somebody's Nostr note opens the same thread there.
location.replace('https://nostrcomments.github.io' + location.pathname + location.search + location.hash);
</script>
</head>
<body>
<p>NostrComments has moved to <a href="https://nostrcomments.github.io/">nostrcomments.github.io/</a>.</p>
</body>
</html>
